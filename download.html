<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self';"
    />
    <title>SCAT前処理ツールをダウンロード</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #17324f;
        background: #f3f7fa;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(560px, calc(100% - 40px));
        padding: 36px;
        text-align: center;
        border: 1px solid #d9e3ec;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(23, 50, 79, 0.12);
      }
      h1 {
        margin: 0 0 14px;
        font-size: 25px;
      }
      p {
        color: #52677c;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 13px 22px;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        border-radius: 10px;
        background: #176b54;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SCAT前処理ツール</h1>
      <p id="status">最新版をダウンロードしています…</p>
      <a id="manual" href="dist/SCAT-preprocessor-offline.html" download hidden>
        ダウンロードをやり直す
      </a>
    </main>
    <script>
      const fileUrl = "dist/SCAT-preprocessor-offline.html";
      const fileName = "SCAT-preprocessor-offline.html";
      const status = document.getElementById("status");
      const manual = document.getElementById("manual");

      fetch(fileUrl)
        .then((response) => {
          if (!response.ok) throw new Error("download failed");
          return response.blob();
        })
        .then((blob) => {
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          status.textContent =
            "ダウンロードが始まりました。このページは閉じて構いません。";
          manual.hidden = false;
        })
        .catch(() => {
          status.textContent =
            "自動ダウンロードを開始できませんでした。下のボタンを押してください。";
          manual.hidden = false;
        });
    </script>
  </body>
</html>
